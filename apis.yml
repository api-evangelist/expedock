aid: expedock
name: Expedock
description: Expedock is a digital business process outsourcing (BPO) and document-automation
  company for the logistics and freight-forwarding industry. It pairs AI-powered document
  automation products (FCL/LCL accounts-payable automation, monthly statement automation,
  and commercial invoice and packing-list data entry) with tech-enabled remote teams
  supported by operations managers and QA specialists. Freight forwarders, 3PLs, and
  supply-chain operators use Expedock to digitize shipping documents, automate back-office
  workflows, and scale operations without scaling headcount. Customers include Maersk,
  Gebrueder Weiss, and large shippers such as Nike, Adidas, Coca-Cola, and Shell.
  Expedock is backed by Insight Partners. The company operates a Digital BPO offering
  and document-automation product suite; it does not currently publish a public developer
  API, SDKs, or API reference documentation.
